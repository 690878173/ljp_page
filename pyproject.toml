[project]
name = "ljp-page"
version = "0.1.0"
description = "综合性Python工具包，包含网络请求、数据分析、可视化、浏览器自动化等功能模块"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "ljp", email = "ljp@outlook.com"}
]
keywords = ["web-scraping", "data-analysis", "visualization", "automation", "network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Visualization",
]

# ============================================================
# 核心依赖（仅保留最基础的、几乎所有模块都需要的）
# 用户执行 pip install ljp-page 时只装这些
# ============================================================
dependencies = [
    # 核心工具
    "pydantic>=2.13.3",
    "lxml>=4.9.0",              # XML/HTML 解析（io 和 request 都会用到）
    "curl-cffi>=0.16.0",        # 网络请求核心（带 TLS 指纹）
    # 数据库基础（轻量）
    "pymysql>=1.2.0",
    "dbutils>=3.1.2",
    # 可选但已默认安装（多数场景需要）
    "requests>=2.31.0",         # 同步请求（备胎）
    "pytest>=9.0.2",
]

# ============================================================
# 可选依赖（按功能模块分组）
# 用户按需安装：pip install ljp-page[组名]
# ============================================================
[project.optional-dependencies]

# ----- 高级网络请求（异步 + WebSocket）-----
request = [
    "aiohttp>=3.9.0",
    "websockets>=16.0",
    "aiofiles>=25.1.0",
]

# ----- 浏览器自动化（Playwright + 浏览器内核，约 500MB）-----
automation = [
    "playwright>=1.40.0",
    "pydoll-python>=2.23.1",
]

# ----- JavaScript 执行 & 加密（常用于逆向）-----
js_crypto = [
    "pyexecjs>=1.5.1",
    "pycryptodome>=3.23.0",
]

# ----- 验证码识别（ddddocr 约 20MB）-----
ocr = [
    "ddddocr>=1.6.1",
]

# ----- TLS 指纹增强（tls-client 有编译依赖）-----
tls = [
    "tls-client>=1.0.1",
]

# ----- 机器学习 + 数据分析（重型，约 500MB ~ 2GB）-----
ml = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.6.0",
    "catboost>=1.2.10",
    # Jupyter 内核（数据分析用户友好）
    "ipykernel>=7.2.0",
]

# ----- 可视化（matplotlib 约 100MB，pyecharts 轻量）-----
viz = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.2",
    "pyecharts>=2.0.0",
]

# ----- SQLAlchemy ORM（重型，可选）-----
orm = [
    "sqlalchemy>=2.0.51",
]

# ----- UI 桌面应用（PyQt6 约 200MB）-----
ui = [
    "pyqt6>=6.11.0",
]

# ----- 完整安装（不含 UI 和 ML，因为太大了）-----
full = [
    "ljp-page[request,automation,js_crypto,ocr,tls,viz,orm]",
]

# ----- 全部功能（警告：极大，可能超过 3GB）-----
all = [
    "ljp-page[full,ml,ui]",
]

# ----- 开发依赖 -----
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

# ============================================================
# 项目元信息
# ============================================================
[project.urls]
Homepage = "https://github.com/690878173/ljp-package"
Documentation = "https://github.com/690878173/ljp-package/blob/main/README.md"
Repository = "https://github.com/690878173/ljp-package"
Issues = "https://github.com/690878173/ljp-package/issues"

# ============================================================
# 构建配置
# ============================================================
[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ljp_page*"]

[tool.setuptools.package-data]
ljp_page = ["py.typed", "*.pyi", "**/*.pyi"]

# ============================================================
# 代码风格工具
# ============================================================
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
